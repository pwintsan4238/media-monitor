services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: mediamonitor
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mm -d mediamonitor"]
      interval: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://mm:${POSTGRES_PASSWORD}@db:5432/mediamonitor
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
    # not published: only the frontend container talks to it

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000   # baked into the Next.js proxy rewrite at build time
    depends_on: [backend]
    ports: ["${WEB_PORT:-3000}:3000"]
    restart: unless-stopped

volumes:
  pgdata:
