name: Collect articles into Google Sheet

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours (UTC); GitHub may delay scheduled runs by several minutes
  workflow_dispatch:          # "Run workflow" button in the Actions tab

permissions:
  contents: read

concurrency:
  group: collect
  cancel-in-progress: false   # never overlap two runs: they would write duplicate rows

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Until the two secrets are added (see README), skip quietly instead of failing every 3 hours.
      HAS_SECRETS: ${{ secrets.SHEET_ID != '' && secrets.GOOGLE_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - name: Check secrets
        if: env.HAS_SECRETS != 'true'
        run: echo "::notice::SHEET_ID and GOOGLE_SERVICE_ACCOUNT_JSON are not set yet; skipping. See the README (Google Sheet mode)."

      - uses: actions/checkout@v4
        if: env.HAS_SECRETS == 'true'

      - uses: actions/setup-python@v5
        if: env.HAS_SECRETS == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        if: env.HAS_SECRETS == 'true'
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Collect new articles
        if: env.HAS_SECRETS == 'true'
        working-directory: backend
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          # Identify the crawler honestly so site owners can see who is visiting.
          CRAWLER_USER_AGENT: "MediaMonitorBot/0.1 (+https://github.com/${{ github.repository }})"
        run: python -m app.sheet_sync
